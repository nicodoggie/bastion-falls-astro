  - Common
cr: "4"
trait:
  - name: Action Surge (1/Short Rest)
    entries:
      - >-
        Once per short or long rest, Finrod can take one additional action on his turn, potentially
        making four weapon attacks total.
  - name: Combat Superiority
    entries:
      - >-
        Finrod has four superiority dice (d8s). He can expend one to fuel a maneuver below. All dice
        are recovered on a short or long rest. His maneuver save DC is 14.
  - name: Student of War
    entries:
      - Finrod can use Intelligence instead of Charisma for Intimidation checks.
action:
  - name: Multiattack
    entries:
      - >-
        Finrod makes two longsword attacks. He may expend a superiority die on one or more of these
        attacks to apply a maneuver. If he uses Action Surge, he makes two additional attacks as
        part of that action.
  - name: Longsword
    entries:
      - >-
        Melee Weapon Attack: +6 to hit, reach 5 ft., one target. Hit: 7 (1d8 + 3) slashing damage,
        or 8 (1d10 + 3) slashing damage if wielded with two hands.
  - name: Trip Attack (Maneuver)
    entries:
      - >-
        When Finrod hits a creature with a weapon attack, he can expend one superiority die to add
        1d8 to the damage roll. If the target is Large or smaller, it must succeed on a DC 14
        Strength saving throw or be knocked prone.
  - name: Sweeping Attack (Maneuver)
    entries:
      - >-
        When Finrod hits a creature with a melee weapon attack, he can expend one superiority die. A
        second creature within 5 feet of the original target and within Finrod's reach takes damage
        equal to the superiority die roll if the original attack roll would have also hit it.
  - name: Precision Attack (Maneuver)
    entries:
      - >-
        When Finrod makes a weapon attack roll, he can expend one superiority die and add the result
        to the roll. He can use this before or after seeing whether the attack hits.
  - name: Shortbow
    entries:
      - >-
        Ranged Weapon Attack: +5 to hit, range 80/320 ft., one target. Hit: 5 (1d6 + 2) piercing
        damage.
bonus:
  - name: Second Wind (1/Short Rest)
    entries:
      - Finrod regains 1d10 + 6 hit points as a bonus action. Once per short or long rest.
reaction:
  - name: Riposte (Maneuver)
    entries:
      - >-
        When a creature misses Finrod with a melee attack, he can expend one superiority die to make
        one melee weapon attack against that creature. On a hit, he adds the superiority die to the
        attack's damage roll.
