cr: "10"
trait:
  - name: Aura of Confession
    entries:
      - >-
        Creatures of Garward's choice within 10 feet of him have a -2 penalty to Wisdom saving
        throws.
  - name: False Orthodoxy
    entries:
      - >-
        Garward appears to fight as the Head Paladin of the Angel of Justice. He has advantage on
        saving throws against being knocked prone or moved against his will, and his weapon attacks
        deal an extra 9 ({@damage 2d8}) radiant damage.
  - name: Legendary Resistance (1/Day)
    entries:
      - If Garward fails a saving throw, he can choose to succeed instead.
  - name: Spellcasting
    entries:
      - >-
        Garward is a 13th-level paladin. His spellcasting ability is Charisma (spell save {@dc 16},
        {@hit +8} to hit with spell attacks). He has the following paladin spells prepared:
      - >-
        1st level (4 slots): {@spell bless}, {@spell command}, {@spell compelled duel}, {@spell
        shield of faith}
      - >-
        2nd level (3 slots): {@spell aid}, {@spell find steed}, {@spell hold person}, {@spell lesser
        restoration}
      - >-
        3rd level (3 slots): {@spell aura of vitality}, {@spell crusader's mantle}, {@spell
        revivify}
      - "4th level (1 slot): {@spell banishment}, {@spell staggering smite}"
action:
  - name: Multiattack
    entries:
      - Garward makes two Longsword attacks.
  - name: Longsword
    entries:
      - >-
        Melee Weapon Attack: {@hit +9} to hit, reach 5 ft., one target. Hit: 9 ({@damage 1d8 + 5})
        slashing damage, or 10 ({@damage 1d10 + 5}) slashing damage if used with two hands, plus 9
        ({@damage 2d8}) radiant damage.
  - name: Divine Smite (3/Day)
    entries:
      - >-
        When Garward hits a creature with a melee weapon attack, he deals an extra 18 ({@damage
        4d8}) radiant damage to the target.
bonus:
  - name: Drink the Green Draught
    entries:
      - >-
        Garward drinks the green liquid and immediately transitions to Phase 2. If he uses this
        bonus action before he is reduced to 0 hit points, discard his remaining Phase 1 hit points.
  - name: Lay on Hands
    entries:
      - Garward touches himself or another creature and restores up to 35 hit points from a pool.
reaction:
  - name: Rebuke the Faithless
    entries:
      - >-
        When a creature Garward can see within 30 feet hits him with an attack, Garward forces the
        creature to make a {@dc 16} Wisdom saving throw. On a failed save, the creature takes 14
        ({@damage 4d6}) radiant damage. On a successful save, the creature takes half as much
        damage.
legendaryActions: 3
legendaryHeader:
  - >-
    Garward can take 3 legendary actions, choosing from the options below. Only one legendary action
    option can be used at a time, and only at the end of another creature's turn. Garward regains
    spent legendary actions at the start of his turn.
legendary:
  - name: Commanding Step
    entries:
      - Garward moves up to half his speed without provoking opportunity attacks.
  - name: Sword of Office
    entries:
      - Garward makes one Longsword attack.
  - name: Ringing Decree (Costs 2 Actions)
    entries:
      - >-
        One creature Garward can see within 60 feet must succeed on a {@dc 16} Wisdom saving throw
        or be frightened of Garward until the end of its next turn.
