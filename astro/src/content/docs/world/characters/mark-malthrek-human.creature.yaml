  average: 52
  formula: 7d8 + 21
speed:
  walk: 30
str: 16
dex: 18
con: 16
int: 10
wis: 14
cha: 11
save:
  str: "+6"
  con: "+6"
skill:
  athletics: "+6"
  perception: "+5"
  stealth: "+7"
  survival: "+5"
