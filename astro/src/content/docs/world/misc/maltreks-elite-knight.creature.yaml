  type: humanoid
  tags:
    - human
alignment:
  - L
  - 'N'
ac:
  - ac: 20
    from:
      - plate
      - shield
hp:
  average: 102
  formula: 12d8 + 48
speed:
  walk: 30
str: 18
dex: 10
con: 18
int: 11
wis: 14
cha: 14
save:
  str: '+7'
  con: '+7'
  wis: '+5'
skill:
  athletics: '+7'
  history: '+3'
  insight: '+5'
  intimidation: '+5'
passive: 12
languages:
  - Common
  - Hickic
cr: '5'
trait:
  - name: Ducal Bearing
    entries:
      - >-
        The knight has advantage on Charisma checks made to command Maltreks soldiers, castle
        servants, or retainers of the ducal household.
  - name: Steadfast
    entries:
      - The knight has advantage on saving throws against being {@condition frightened}.
action:
  - name: Multiattack
    entries:
      - The knight makes three melee attacks.
  - name: Warhammer
    entries:
      - >-
        Melee Weapon Attack: {@hit +7} to hit, reach 5 ft., one target. Hit: 8 ({@damage 1d8 + 4}) bludgeoning
        damage, or 9 ({@damage 1d10 + 4}) bludgeoning damage if used with two hands.
  - name: Javelin
    entries:
      - >-
        Melee or Ranged Weapon Attack: {@hit +7} to hit, reach 5 ft. or range 30/120 ft., one target. Hit:
        7 ({@damage 1d6 + 4}) piercing damage.
  - name: Commanding Rebuke (Recharge 5-6)
    entries:
      - >-
        The knight shouts a ducal command at one creature it can see within 30 feet. The target must
        succeed on a {@dc 15} Wisdom saving throw or take 18 ({@damage 4d8}) psychic damage and have disadvantage
        on the next attack roll it makes before the end of its next turn.
bonus:
  - name: Advance the Line
    entries:
      - >-
        The knight chooses up to three allied soldiers, guards, or knights within 60 feet that can
        hear it. Each target can move up to 10 feet and gains 5 temporary hit points.
reaction:
  - name: Parry
    entries:
      - >-
        The knight adds 3 to its AC against one melee attack that would hit it. To do so, the knight
        must see the attacker and be wielding a melee weapon.
