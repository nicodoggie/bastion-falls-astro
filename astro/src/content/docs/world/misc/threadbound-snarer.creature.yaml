  "trait": [
    {
      "name": "Exposed Control Knot",
      "entries": [
        "The visible knot at the base of the puppet\u2019s neck controls its grafts. A creature within 5 feet can use its action to attempt a DC 16 Dexterity (Sleight of Hand) or Wisdom (Medicine) check to disable the knot. On a success, the puppet is incapacitated and its speed is 0 until the end of its next turn. If another such check succeeds while it is incapacitated by this trait, control ends permanently: it stops fighting and needs medical care. Failure deals no damage. A puppet reduced to 0 hit points falls unconscious and is stable unless the damage kills it outright. Ending control does not remove its grafts. These are proposed encounter-specific rules, not general rules for Mallow\u2019s needle."
      ]
    }
  ],
  "action": [
    {
      "name": "Multiattack",
      "entries": [
        "The threadbound snarer makes three Tendon Hook attacks."
      ]
    },
    {
      "name": "Tendon Hook",
      "entries": [
        "Melee Weapon Attack: {@hit +7} to hit, reach 15 ft., one target. Hit: 18 ({@damage 4d6 + 4}) slashing damage. Once on each of the snarer\u2019s turns, a Large or smaller target hit by this attack must succeed on a {@dc 15} Strength saving throw or be pulled up to 10 feet toward the snarer."
      ]
    },
    {
      "name": "Stitch the Crossing (Recharge 5\u20136)",
      "entries": [
        "The snarer stretches visible threads across a 20-foot-long, 10-foot-high, 5-foot-thick area within 30 feet. The area is difficult terrain for all creatures for 1 minute or until the snarer uses this action again, is incapacitated, or loses control. A creature entering the area for the first time on a turn must succeed on a {@dc 15} Dexterity saving throw or its speed becomes 0 until the end of that turn. A creature makes this save at most once per turn. Any 5-foot section has AC 12, 10 hit points, immunity to poison and psychic damage, and can be destroyed independently. The threads do not block sight or attacks."
      ]
    }
  ]
