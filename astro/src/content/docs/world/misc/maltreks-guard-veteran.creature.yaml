ac:
  - ac: 18
    from:
      - splint
      - shield
hp:
  average: 75
  formula: 10d8 + 30
speed:
  walk: 30
str: 16
dex: 12
con: 16
int: 10
wis: 13
cha: 11
save:
  str: '+5'
  con: '+5'
