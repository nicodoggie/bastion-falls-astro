trait:
  - name: Castle Watch
    entries:
      - >-
        The veteran has advantage on Wisdom (Perception) checks made to notice intruders, concealed
        weapons, or false credentials inside a noble residence, chapel, or fortress.
  - name: Compromised Loyalty
    entries:
      - >-
        If the veteran starts its turn within 30 feet of a Reformist cleric, it has advantage on
        saving throws against being {@condition charmed} or {@condition frightened} until the start of its next turn.
action:
  - name: Multiattack
    entries:
      - The veteran makes two longsword attacks.
  - name: Longsword
    entries:
      - >-
        Melee Weapon Attack: {@hit +5} to hit, reach 5 ft., one target. Hit: 7 ({@damage 1d8 + 3}) slashing damage,
        or 8 ({@damage 1d10 + 3}) slashing damage if used with two hands.
  - name: Heavy Crossbow
    entries:
      - >-
        Ranged Weapon Attack: {@hit +3} to hit, range 100/400 ft., one target. Hit: 6 ({@damage 1d10 + 1}) piercing
        damage.
reaction:
  - name: Hold the Threshold
    entries:
      - >-
        When a hostile creature the veteran can see enters a space within 5 feet of it, the veteran
        makes one longsword attack against that creature.
