trait:
  - name: Boundary-Touched Body
    entries:
      - >-
        The dark archon can move through the space of hostile creatures. The first time it enters a
        creature's space on a turn, that creature must succeed on a {@dc 15} Wisdom saving throw or be
        unable to take reactions until the start of the dark archon's next turn.
  - name: Mockery of Archons
    entries:
      - >-
        The dark archon has advantage on Charisma (Deception) checks made to imitate, profane, or
        exploit Orthodox command rites associated with a Patriarch's archons.
  - name: Spellcasting
    entries:
      - >-
        The dark archon is a 5th-level spellcaster. Its spellcasting ability is Intelligence (spell
        save {@dc 14}, {@hit +6} to hit with spell attacks). It has the following wizard spells prepared:
      - 'Cantrips (at will): {@spell mage hand}, {@spell minor illusion}, {@spell ray of frost}'
      - '1st level (4 slots): {@spell disguise self}, {@spell mage armor}, {@spell shield}'
      - '2nd level (3 slots): {@spell blur}, {@spell misty step}'
      - '3rd level (2 slots): {@spell counterspell}, {@spell hypnotic pattern}'
action:
  - name: Multiattack
    entries:
      - The dark archon makes three boundary strike attacks.
  - name: Boundary Strike
    entries:
      - >-
        Melee Weapon Attack: {@hit +7} to hit, reach 5 ft., one target. Hit: 8 ({@damage 1d8 + 4}) bludgeoning damage
        plus 7 ({@damage 2d6}) psychic damage.
  - name: Boundary Rend (Recharge 5-6)
    entries:
      - >-
        The dark archon opens a wavering tear in a 30-foot line that is 5 feet wide. Each creature
        in that line must make a {@dc 15} Intelligence saving throw, taking 31 ({@damage 7d8}) psychic damage on
        a failed save, or half as much damage on a successful one. A creature that fails the save is
        also disoriented until the end of its next turn. While disoriented, the creature subtracts
        {@dice 1d4} from attack rolls and ability checks.
bonus:
  - name: Boundary Step
    entries:
      - >-
        The dark archon teleports up to 30 feet to an unoccupied space it can see. Until the end of
        the turn, it has advantage on the first boundary strike attack it makes.
reaction:
  - name: Deflect Spell
    entries:
      - >-
        When the dark archon is hit by a ranged spell attack, it reduces the damage by 16 ({@damage 1d10 + 11}). If this reduces the damage to 0, the dark archon can redirect the spell at another
        creature within 60 feet of it, using the original attack roll.
