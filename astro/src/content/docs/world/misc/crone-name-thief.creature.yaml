cr: "15"
trait:
  - name: Magic Resistance
    entries:
      - The hag has advantage on saving throws against spells and other magical effects.
  - name: Innate Spellcasting
    entries:
      - >-
        The hag's spellcasting ability is Charisma (spell save {@dc 18}). She requires no material
        components for these spells, but uses their normal verbal and somatic components.
      - "At will: {@spell detect magic}, {@spell disguise self}, {@spell minor illusion}"
      - >-
        1/day each: {@spell counterspell}, {@spell dispel magic}, {@spell hold monster}, {@spell
        remove curse}
action:
  - name: Multiattack
    entries:
      - The hag makes three Unnaming Needle attacks.
  - name: Unnaming Needle
    entries:
      - >-
        Ranged Spell Attack: {@hit +10} to hit, range 120 ft., one target. Hit: 32 ({@damage 6d8 +
        5}) psychic damage. This magical attack is not a spell.
  - name: Steal the Reply (Recharge 5-6)
    entries:
      - >-
        One creature within 60 feet that can hear the hag must succeed on a {@dc 18} Charisma saving
        throw or lose its voice for up to 1 minute. It cannot speak or provide verbal spell
        components, but retains its identity, memories, telepathy, and all other actions. The hag
        must concentrate as if on a spell. The target repeats the save at the end of each of its
        turns, ending the effect on itself on a success.
      - >-
        A creature within 5 feet of the target can use an action to encourage it, allowing an
        immediate additional saving throw with advantage. The effect counts as a 5th-level spell for
        {@spell dispel magic}; {@spell remove curse} also ends it. If both other members of the
        hag's triad are conscious and within 30 feet of her when she uses this action, she can
        choose a second target in range. Both effects share her concentration. This ability is not a
        spell and does not erase or steal a true name.
bonus:
  - name: Coven Step
    entries:
      - >-
        While another conscious allied hag is within 30 feet of her, the hag magically moves up to
        10 feet without provoking opportunity attacks. She must end on a surface that can support
        her. This is movement, not teleportation, and cannot cross a solid barrier.
reaction:
  - name: Yielding (1/Long Rest)
    entries:
      - >-
        When the hag would take an instance of physical or magical damage, she can prevent that
        instance of damage to herself. Her hit points then become 1. This does not protect an ally,
        restore spell uses, or end conditions.
