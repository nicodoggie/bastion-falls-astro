name: Maltreks Reformist Sergeant
size:
  - M
type:
  type: humanoid
  tags:
    - human
alignment:
  - L
  - E
ac:
  - ac: 17
    from:
      - half plate
hp:
  average: 52
  formula: 8d8 + 16
speed:
  walk: 30
str: 16
dex: 12
con: 14
int: 11
wis: 12
cha: 13
save:
  str: "+5"
  wis: "+3"
skill:
  athletics: "+5"
  deception: "+3"
  intimidation: "+3"
passive: 11
languages:
  - Common
  - Hickic
cr: "2"
trait:
  - name: Courtly Disguise
    entries:
      - >-
        The sergeant has advantage on Charisma (Deception) checks made to pass as an Orthodox guard,
        mourner, or ducal retainer.
  - name: Reformist Cadence
    entries:
      - >-
        Allied Reformist soldiers within 30 feet of the sergeant add {@dice 1d4} to saving throws
        against being {@condition frightened}.
action:
  - name: Multiattack
    entries:
      - The sergeant makes two halberd attacks.
  - name: Halberd
    entries:
      - >
        Melee Weapon Attack: {@hit +5} to hit, reach 10 ft., one target. Hit: 8 ({@damage 1d10 + 3})
        slashing damage.
  - name: Heavy Crossbow
    entries:
      - >-
        Ranged Weapon Attack: {@hit +3} to hit, range 100/400 ft., one target. Hit: 6 ({@damage 1d10
        + 1}) piercing damage.
bonus:
  - name: Funeral Formation
    entries:
      - >-
        The sergeant chooses up to two allies within 30 feet that can hear it. Each target can move
        up to half its speed without provoking opportunity attacks.
reaction:
  - name: Shield the Minister
    entries:
      - >-
        When a creature the sergeant can see hits an allied cleric or noble within 5 feet of the
        sergeant, the sergeant imposes a -2 penalty on the attack roll, potentially causing the
        attack to miss.
