name: Fire Bolt
level: 0
school: V
time:
  - number: 1
    unit: action
range:
  type: point
  distance:
    type: feet
    amount: 120
components:
  v: true
  s: true
duration:
  - type: instant
entries:
  - >-
    You hurl a mote of fire at a creature or object within range. Make a ranged spell attack against
    the target. On a hit, the target takes 1d10 fire damage. A flammable object hit by this spell
    ignites if it isn't being worn or carried.
  - >-
    This spell's damage increases by 1d10 when you reach 5th level (2d10), 11th level (3d10), and
    17th level (4d10).
