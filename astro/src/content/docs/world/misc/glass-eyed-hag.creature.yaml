  - L
  - N
ac:
  - ac: 12
    from:
      - leather armor
hp:
  average: 110
  formula: 20d8 + 20
speed:
  walk: 30
  fly: 45
str: 10
dex: 16
con: 12
int: 18
wis: 14
cha: 10
save:
  int: "+7"
  wis: "+5"
  cha: "+3"
skill:
  history: "+2"
  performance: "+2"
senses:
  - truesight
passive: 15
languages:
  - Common
  - Sylvan
cr: "6"
trait:
  - name: Kaleidoscope Eyes
    entries:
      - >-
        At the start of each of the glass eyed hag's turns, roll a {@dice 1d4}. The patterns in her
        eyes change to resemble a certain shape depending on the result. Each shape changes the
        actions she can perform.
      - "1, flowers: the glass eyed hag can perform Cellophane."
      - "2, stars: the glass eyed hag can perform Diamond Dust."
      - "3, clovers: the glass eyed hag can perform Luck Drain."
      - "4, hearts: the glass eyed hag can perform Summon Lonely Hearts."
action:
  - name: Multiattack
    entries:
      - >-
        The glass eyed hag makes one Marshmallow Pie attack and uses one action enabled by her
        Kaleidoscope Eyes.
  - name: Marshmallow Pie
    entries:
      - >-
        Ranged Weapon Attack: {@hit +6} to hit, range 60/240 ft., one target. Hit: 6 ({@damage 1d6 +
        3}) bludgeoning damage plus 7 ({@damage 1d8 + 3}) psychic damage.
  - name: Cellophane (Flower)
    entries:
      - >-
        The glass eyed hag can perform this action only if the patterns in her eyes are flowers.
        Ranged Weapon Attack: {@hit +5} to hit, range 60/120 ft., one target. Hit: 10 ({@damage 2d6
        + 3}) slashing damage. A translucent yellow or green plastic material shoots from the glass
        eyed hag's palm onto a creature of her choice. The target must succeed on a {@dc 14}
        Dexterity saving throw or be wrapped in the form of a flower. A creature wrapped in the
        cellophane takes 7 ({@damage 2d6}) necrotic damage at the start of each of its turns. As an
        action, the creature can escape by succeeding on a {@dc 14} Strength saving throw.
  - name: Diamond Dust (Stars)
    entries:
      - >-
        The glass eyed hag can perform this action only if the patterns in her eyes are stars. The
        glass eyed hag breathes a gust of diamond dust in a 60-foot cone. Each creature in that area
        must succeed on a {@dc 14} Dexterity saving throw or have severe difficulty breathing and
        become {@condition incapacitated}. At the start of each of its turns, the creature can make
        a {@dc 14} Constitution saving throw, ending the effect on itself on a success.
  - name: Luck Drain (Clovers)
    entries:
      - >-
        The glass eyed hag can perform this action only if the patterns in her eyes are clovers. One
        creature the glass eyed hag can see within 60 feet must succeed on a {@dc 14} Wisdom saving
        throw or become unlucky. While unlucky, whenever the creature makes an ability check, attack
        roll, or saving throw, it must roll a {@dice d8} and subtract the number rolled from the
        total.
  - name: Summon Lonely Hearts (Hearts)
    entries:
      - >-
        The glass eyed hag can perform this action only if the patterns in her eyes are hearts. The
        glass eyed hag summons two Lonely Hearts: Large humanoids with AC 10 and 18 ({@dice 3d8 +
        3}) hit points. A Lonely Heart has the Fanboi trait: whenever the glass eyed hag moves more
        than 5 feet away from the Lonely Heart, it uses all its actions to move within 5 feet of
        her. A Lonely Heart also has the Protecc reaction: when the glass eyed hag is attacked while
        the Lonely Heart is within 5 feet of her, the Lonely Heart automatically lunges to take the
        damage instead.
  - name: Solar Flare (Recharge 5-6)
    entries:
      - >-
        A flash of light emanates from the glass eyed hag's kaleidoscope eyes. Each creature in a
        30-foot cone must succeed on a {@dc 14} Constitution saving throw or be {@condition blinded}
        for {@dice 1d4} rounds.
