cr: "8"
name: Ingotback Warding Adult
size:
  - L
type: elemental
alignment:
  - U
ac:
  - ac: 17
    from:
      - ceramic shell
hp:
  average: 136
  formula: 16d10 + 48
speed:
  walk: 30
  burrow: 20
str: 20
dex: 10
con: 17
int: 5
wis: 14
cha: 7
save:
  con: "+6"
  wis: "+5"
skill:
  perception: "+5"
resist:
  - bludgeoning
  - piercing
  - slashing
immune:
  - fire
  - poison
conditionImmune:
  - exhaustion
  - paralyzed
  - petrified
  - poisoned
senses:
  - darkvision 120 ft.
  - tremorsense 60 ft.
passive: 15
languages:
  - understands Terran but can't speak
trait:
  - name: Ceramic Carapace
    entries:
      - >-
        The ingotback has advantage on saving throws against effects that would move it or knock it
        prone. Its natural weapon attacks are magical.
  - name: Siege Body
    entries:
      - The ingotback deals double damage to objects and structures.
  - name: Warding Instinct
    entries:
      - >-
        While the ingotback is within 60 feet of an allied cubifabrid that has fewer hit points than
        it, the ingotback has advantage on Wisdom (Perception) checks and can't be frightened.
action:
  - name: Multiattack
    entries:
      - The ingotback makes one bite attack and one foreclaw attack.
  - name: Bite
    entries:
      - >-
        Melee Weapon Attack: {@hit +8} to hit, reach 5 ft., one target. Hit: 16 ({@damage 2d10 + 5})
        piercing damage.
  - name: Foreclaw
    entries:
      - >-
        Melee Weapon Attack: {@hit +8} to hit, reach 5 ft., one target. Hit: 14 ({@damage 2d8 + 5})
        slashing damage. If the target is Large or smaller, it must succeed on a {@dc 16} Strength
        saving throw or be pushed up to 10 feet.
  - name: Molten Casting (Recharge 5–6)
    entries:
      - >-
        The ingotback braces and expels molten bismuth in a 30-foot-long, 5-foot-wide line. Each
        creature in the line must make a {@dc 15} Dexterity saving throw, taking 28 ({@damage 8d6})
        fire damage on a failed save, or half as much damage on a successful one. On a failed save,
        a creature is also restrained by rapidly cooling metal. A restrained creature can use its
        action to make a {@dc 15} Strength (Athletics) check, freeing itself on a success. The
        casting around one creature can also be destroyed (AC 17; 20 hit points; immunity to poison
        and psychic damage; vulnerability to thunder damage).
      - >-
        The line remains until cleared. Its spaces are difficult terrain, and a creature that enters
        one of those spaces for the first time on a turn or starts its turn there takes 5 ({@damage
        1d10}) piercing damage. A 5-foot section has AC 17 and 20 hit points and shares the
        casting's immunities and vulnerability.
