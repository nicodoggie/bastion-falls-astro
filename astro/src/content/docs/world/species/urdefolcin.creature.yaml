trait:
  - name: Magic Resistance
    entries:
      - The urdefolcin has advantage on saving throws against spells and other magical effects.
  - name: Tree Stride
    entries:
      - >-
        Once on its turn, the urdefolcin can use 10 ft. of its movement to step magically into one
        living tree within its reach and emerge from a second living tree within 60 ft. of the first
        tree, appearing in an unoccupied space within 5 ft. of the second tree. Both trees must be
        Large or bigger.
action:
  - name: Multiattack
    entries:
      - The urdefolcin makes one bite attack and two claw attacks per round.
  - name: Bite
    entries:
      - "Melee Weapon Attack: +7 to hit, reach 5 ft., one target. Hit: 18 (4d6 + 4) piercing damage."
  - name: Claw
    entries:
      - >-
        Melee Weapon Attack: +7 to hit, reach 10 ft., one creature. Hit: 13 (2d8 + 4) slashing
        damage.
