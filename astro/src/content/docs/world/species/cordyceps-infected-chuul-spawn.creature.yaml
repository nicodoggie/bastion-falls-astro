trait:
  - name: Amphibious
    entries:
      - The chuul spawn can breathe air and water.
  - name: Cordyceps Infection
    entries:
      - >-
        Once per day, the chuul spawn can attempt to infect a creature it has grappled with its
        cordyceps spores. The target must make a DC 12 Constitution saving throw or become infected.
        The infected creature takes 1d6 necrotic damage per round and is under the control of the
        chuul spawn. The creature can repeat the saving throw at the end of each of its turns,
        ending the effect on a success.
  - name: Grappler
    entries:
      - The chuul spawn has advantage on attack rolls against any creature it has grappled.
action:
  - name: Multiattack
    entries:
      - The chuul spawn makes two claw attacks.
  - name: Claw
    entries:
      - "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) slashing damage."
