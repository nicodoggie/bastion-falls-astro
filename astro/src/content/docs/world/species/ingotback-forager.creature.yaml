cr: "6"
name: Ingotback Foraging Adult
size:
  - L
type: elemental
alignment:
  - U
ac:
  - ac: 16
    from:
      - ceramic shell
hp:
  average: 114
  formula: 12d10 + 48
speed:
  walk: 30
  burrow: 20
str: 18
dex: 11
con: 18
int: 5
wis: 13
cha: 7
save:
  con: "+7"
skill:
  perception: "+4"
resist:
  - bludgeoning
  - piercing
  - slashing
immune:
  - fire
  - poison
conditionImmune:
  - exhaustion
  - paralyzed
  - petrified
  - poisoned
senses:
  - darkvision 120 ft.
