trait:
  - name: Gem Passage
    entries:
      - >-
        The Gem Spirit can move through spaces occupied by raw gemstones as if they were difficult
        terrain. If the spirit ends its turn inside a gemstone, it becomes incorporeal and gains
        resistance to all damage until the start of its next turn.
  - name: Crystalline Form
    entries:
      - >-
        When the Gem Spirit is struck by a melee weapon, shards of its crystalline body explode
        outward. The attacker must succeed on a DC 12 Dexterity saving throw or take 4 (1d8)
        piercing damage.
  - name: Shimmering Light
    entries:
      - >-
        Recharge 5-6. The Gem Spirit emits a dazzling burst of light. Each creature within 15 feet
        must succeed on a DC 12 Constitution saving throw or be blinded until the end of its next
        turn.
action:
  - name: Shimmer Strike
    entries:
      - "Melee Weapon Attack: +5 to hit, reach 5 ft., one target. Hit: 10 (2d6 + 3) radiant damage."
  - name: Gem Resonance
    entries:
      - >-
        1/Day. The Gem Spirit resonates with nearby raw gemstones, causing an eruption of energy.
        Each creature within 10 feet of a gemstone the spirit occupies must make a DC 12 Dexterity
        saving throw, taking 14 (4d6) thunder damage on a failed save or half as much on a
        successful one.
