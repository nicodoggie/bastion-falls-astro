dmg1: 2d6
dmgType: S
bonusWeapon: "+3"
entries:
  - >-
    Forged in the Summer Queen's radiance, this greatsword bears a topaz-set hilt and was one of the
    Four Elven Boons. Titania gifted it to the elven host, and the elves in turn passed it to the
    Mathrantor'al—whose haughtiness matched the High Elves and whose sense of blind justice ran just
    as deep.
  - >-
    **Vorpal blade.** You gain a +3 bonus to attack and damage rolls made with this magic weapon. In
    addition, the weapon ignores resistance to slashing damage.
  - >-
    **Head-taker.** When you attack a creature that has at least one head with this weapon and roll
    a 20 on the attack roll, you cut off one of the creature's heads. The creature dies if it can't
    survive without the lost head. A creature is immune to this effect if it is immune to slashing
    damage, doesn't have or need a head, has legendary actions, or the GM decides that the creature
    is too big for its head to be cut off with this weapon. Such a creature instead takes an extra
    6d8 slashing damage from the hit.
  - >-
    **Unshaken duelist.** While you are attuned to this sword, if you are not frightened, your
    confidence in your own fighting prowess becomes armored truth. You have immunity to damage of
    every type—whether from weapons, unarmed strikes, spells, environmental effects, or any other
    source—including acid, bludgeoning, cold, fire, force, lightning, necrotic, piercing, poison,
    psychic, radiant, slashing, and thunder damage. You also have immunity to every condition except
    the frightened condition.
  - >-
    **Frailty of doubt.** If you become frightened, these benefits cease until you finish a short or
    long rest, even if the condition ends sooner.
  - "**Unusable by undead.** This sword cannot be used by undead creatures."
