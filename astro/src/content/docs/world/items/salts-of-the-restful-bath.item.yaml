name: Salts of the Restful Bath
source: BF
type: wondrous item
rarity: rare
wondrous: true
reqAttune: false
entries:
  - >-
    These magical bath salts turn an ordinary pool into a restorative bath. Each dose is consumed
    when dissolved in water and provides a single use.
  - >-
    Dissolve one dose in water held in a container with an internal capacity no greater than 30
    cubic feet. The treated water remains magical for 1 hour. A creature that remains in the water
    for that full hour gains the benefits of a long rest.
  - >-
    The bath has no fixed limit on the number of creatures it can benefit. However, every
    participating creature must plausibly have enough room and water depth to fully submerge at the
    same time. The GM determines the bath's capacity from the container's shape, the amount of
    water, and the creatures' sizes.
  - >-
    Full submersion is a capacity requirement, not a bathing requirement. A bather need not hold its
    breath, remain immersed up to the neck, or stay in one posture for the entire hour. It must
    simply remain in the treated water for the full hour.
