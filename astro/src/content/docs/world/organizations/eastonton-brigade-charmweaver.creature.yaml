trait:
  - name: Spellcasting
    entries:
      - >-
        The charmweaver is a 6th-level wizard. Its spellcasting ability is Intelligence (spell save
        DC 13, +5 to hit with spell attacks). It has the following spells prepared:
      - "Cantrips (at will): mage hand, minor illusion, prestidigitation"
      - "1st level (4 slots): charm person, mage armor, shield"
      - "2nd level (3 slots): mirror image, suggestion"
      - "3rd level (3 slots): counterspell, hypnotic pattern"
      - >-
        In combat the charmweaver favors hypnotic pattern to thin the field, charm person to sway
        priority targets, and mirror image when pressured.
      - While mage armor is active, its AC is 15 (including Dexterity).
action:
  - name: Enchanted Dagger
    entries:
      - >-
        Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) piercing damage,
        and the target must succeed on a DC 13 Wisdom saving throw or be charmed by the charmweaver
        until the end of the target's next turn.
bonus:
  - name: Enchanting Presence (Recharge 5-6)
    entries:
      - >-
        As a bonus action, the charmweaver exudes an aura of charm for 1 minute. Each creature of
        the charmweaver's choice within 10 feet of it must succeed on a DC 13 Wisdom saving throw or
        be charmed until the aura ends or the charmweaver is incapacitated. While charmed in this
        way, a creature cannot willingly attack the charmweaver.
reaction:
  - name: Shield
    entries:
      - >-
        When the charmweaver is hit by an attack roll or targeted by magic missile, it casts shield
        (1st level). Until the start of its next turn, it has a +5 bonus to AC, including against
        the triggering attack.
