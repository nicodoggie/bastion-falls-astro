[global]
flavor = "mdx"
# Exclude files/directories
exclude = [
    "**/dist",
    "**/timeline-generated.mdx",
    ".git",
    ".kilo/*",
    ".specstory/*",
    "5etools-src/*"
    "AGENTS.personality.md",
    "astro/src/assets/transcripts",
    "astro/.astro",
    "node_modules",
]

# Set line length limit
line_length = 100

# Unordered list style
[MD004]
style = "dash"

# List indentation
[MD007]
style = "text-aligned"

# Ordered list style
[MD029]
style = "one-one"

[MD013]
line-length = 100
code-blocks = false
tables = false
reflow = true
reflow-mode = "default"

[MD025]
front-matter-title = "title"

[MD033]
enabled = true
fix = true
allowed = ["table", "th", "tr", "td", "thead", "tbody"]
fix-mode = "relaxed"
br-style = "backslash"

[MD041]
enabled = false

[code-block-tools]
enabled = true
normalize-language = "linguist"
on-missing-language-definition = "warn"
on-missing-tool-binary = "warn"

[code-block-tools.languages.markmap]
lint = ["rumdl"]


[code-block-tools.languages.markdown]
lint = ["rumdl"]
