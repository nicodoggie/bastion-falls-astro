name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          submodules: recursive
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: "false"

      - name: Install dependencies
        env:
          NODE_ENV: ci
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm turbo run build --filter=@bastion-falls/astro

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy
      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOYMENT_STATUS: ${{ job.status }}
        run: |
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';

          const webhook = process.env.DISCORD_WEBHOOK;
          if (!webhook) {
            console.warn('Discord notification skipped: webhook is not configured.');
            process.exit(0);
          }
          const gitValue = (format, fallback) => {
            try {
              return execFileSync('git', ['log', '-1', `--pretty=format:${format}`], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'ignore'],
              }).trim();
            } catch {
              return fallback;
            }
          };
          const success = process.env.DEPLOYMENT_STATUS === 'success';
          const sha = process.env.GITHUB_SHA || 'unknown';
          const commitUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/commit/${sha}`;
          const content = [
            `${success ? '🚀' : '⚠️'} **Deployment ${success ? 'Successful' : 'Unsuccessful'}!**`,
            '',
            `**Commit:** [${gitValue('%h', sha.slice(0, 7))}](${commitUrl})`,
            `**Author:** ${gitValue('%an', process.env.GITHUB_ACTOR || 'unknown')}`,
            `**Message:** ${gitValue('%s', sha)}`,
            `**Branch:** ${process.env.GITHUB_REF_NAME}`,
            '**Environment:** Production',
            '',
            success ? 'Site is now live at: https://bastion-falls.thekennel.info' : 'See the workflow run for details.',
          ].join('\n').slice(0, 2000);
          const response = await fetch(webhook, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content, allowed_mentions: { parse: [] } }),
            signal: AbortSignal.timeout(10000),
          });
          if (!response.ok) {
            throw new Error(`Discord notification failed (HTTP ${response.status}).`);
          }
          NODE
