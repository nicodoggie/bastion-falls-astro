# Publish @bastion-falls/5e-schema-zod to npm.
#
# DISABLED — trigger is workflow_dispatch only (manual).
# Before enabling an automatic trigger:
#   1. Set "private": false in packages/5e-schema-zod/package.json
#   2. Ensure the package name is correct for your npm org
#   3. Add an NPM_TOKEN secret to the repository
#   4. Replace the `workflow_dispatch` trigger with push/release as desired

name: Publish 5e-schema-zod

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual publish)'
        type: boolean
        default: true

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # for npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: package.json
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: "false"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm -F @bastion-falls/5e-schema-zod build

      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: |
          cd packages/5e-schema-zod
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: |
          echo "Dry run — skipping publish."
          echo "Built dist/:"
          ls -la packages/5e-schema-zod/dist/
